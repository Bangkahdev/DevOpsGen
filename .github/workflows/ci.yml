name: CI

on:
  push:
    branches: [main, "phase-*", "Phase-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          find . -name '*.go' -type f -exec sed -i 's/\r$//' {} +
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt issues in:"
            echo "$fmt_out"
            exit 1
          fi

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)"/bin/actionlint -color .github/workflows/ci.yml .github/workflows/release.yml

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Test with coverage (per package)
        run: |
          go test -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out > coverage.txt
          cat coverage.txt

      - name: Enforce coverage floor (80% per core package)
        run: |
          # Check each core package individually
          for pkg in config detector generator validator filesystem; do
            cov=$(go test -coverprofile=/tmp/pkg.out ./internal/$pkg/ 2>/dev/null | grep -oP 'coverage: \K[\d.]+')
            echo "$pkg coverage: $cov%"
            awk -v t="$cov" 'BEGIN { if (t < 80) { print "$pkg coverage " t "% is below 80% floor"; exit 1 } }'
          done
          TOTAL=$(grep -E '^total:' coverage.txt | awk '{print $NF}' | sed 's/%//')
          echo "Total coverage: $TOTAL%"
          awk -v t="$TOTAL" 'BEGIN { if (t < 80) { print "total coverage " t "% is below 80% floor"; exit 1 } }'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'

      - name: Build
        run: go build -o devopsgen-${{ matrix.os }}-${{ matrix.arch }} ./cmd/devopsgen

      - name: Smoke test
        shell: bash
        run: |
          ./devopsgen-${{ matrix.os }}-${{ matrix.arch }} version
          ./devopsgen-${{ matrix.os }}-${{ matrix.arch }} --help

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: devopsgen-${{ matrix.os }}-${{ matrix.arch }}
          path: devopsgen-${{ matrix.os }}-${{ matrix.arch }}

  docker-build-go:
    name: Docker Build (Go)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'

      - name: Generate Go artifacts
        run: |
          go build -o devopsgen ./cmd/devopsgen
          mkdir -p /tmp/e2e-go
          ./devopsgen init \
            --stack go --ci github-actions --registry ghcr \
            --image bangkah/my-app --port 8080 \
            --test-cmd "go test ./..." \
          --build-path ./cmd/devopsgen \
          --tag v1 --k8s \
          --output-dir /tmp/e2e-go
          cp go.mod go.sum /tmp/e2e-go/
          cp -r cmd /tmp/e2e-go/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Go Docker image
        run: |
          docker build \
            --build-arg GO_VERSION=1.24 \
            -t devopsgen-go-test \
            -f /tmp/e2e-go/Dockerfile \
            .

      - name: Lint generated Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: /tmp/e2e-go/Dockerfile

  docker-build-nodejs:
    name: Docker Build (Node.js)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'

      - name: Generate Node.js artifacts
        run: |
          go build -o devopsgen ./cmd/devopsgen
          mkdir -p /tmp/e2e-node
          ./devopsgen init \
            --stack nodejs --app-type express --ci github-actions \
            --registry ghcr --image bangkah/api --port 3000 \
            --start-cmd "node server.js" \
            --output-dir /tmp/e2e-node

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Node.js Docker image
        run: |
          docker build -t devopsgen-node-test -f /tmp/e2e-node/Dockerfile /tmp/e2e-node

      - name: Lint generated Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: /tmp/e2e-node/Dockerfile

  k8s-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'

      - name: Generate K8s artifacts
        run: |
          go build -o devopsgen ./cmd/devopsgen
          mkdir -p /tmp/e2e-k8s
          ./devopsgen init \
            --stack go --ci github-actions --registry ghcr \
            --image bangkah/my-app --port 8080 \
            --k8s --ingress \
            --ingress-host app.example.com --health-path /health \
            --output-dir /tmp/e2e-k8s

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/download/v0.4.13/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate Kubernetes manifests with kubeconform
        run: |
          kubeconform /tmp/e2e-k8s/kubernetes/deployment.yaml
          kubeconform /tmp/e2e-k8s/kubernetes/service.yaml
          kubeconform /tmp/e2e-k8s/kubernetes/ingress.yaml

      - name: Validate with DevOpsGen validator
        run: |
          ./devopsgen validate --dir /tmp/e2e-k8s

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [docker-build-go, docker-build-nodejs, k8s-validate]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'

      - name: Run end-to-end generation and validate
        shell: bash
        run: |
          go build -o devopsgen ./cmd/devopsgen
          mkdir -p /tmp/e2e-final
          ./devopsgen init \
            --stack go --ci github-actions --registry ghcr \
            --image bangkah/my-app --port 8080 \
            --build-cmd "go build -o server ." --test-cmd "go test ./..." \
            --tag v1 --k8s --ingress \
            --ingress-host app.example.com --health-path /health \
            --output-dir /tmp/e2e-final
          test -f /tmp/e2e-final/Dockerfile
          test -f /tmp/e2e-final/.github/workflows/ci.yml
          test -f /tmp/e2e-final/kubernetes/deployment.yaml
          test -f /tmp/e2e-final/kubernetes/service.yaml
          test -f /tmp/e2e-final/kubernetes/ingress.yaml
          ./devopsgen validate --dir /tmp/e2e-final
