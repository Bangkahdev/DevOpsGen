# Kubernetes Deployment generated by DevOpsGen.
# Baseline resource values are not optimal for every workload —
# adjust requests/limits based on actual load.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsgen
  labels:
    app: devopsgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devopsgen
  template:
    metadata:
      labels:
        app: devopsgen
    spec:
      containers:
        - name: devopsgen
          image: ghcr.io/bangkah/devopsgen:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
