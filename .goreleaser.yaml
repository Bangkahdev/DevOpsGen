version: 2

project_name: devopsgen

before:
  hooks:
    - go mod tidy

builds:
  - id: devopsgen
    binary: devopsgen
    main: ./cmd/devopsgen
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X devopsgen.dev/devopsgen/internal/templates.Version={{.Version}}

archives:
  - id: default
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{.Version}}-{{.Timestamp}}"

changelog:
  sort: asc
  filters:
    - exclude: "(^docs:)|(^test:)|(^chore:)|(^ci:)|(^build:)|(^refactor:)|(^style:)"