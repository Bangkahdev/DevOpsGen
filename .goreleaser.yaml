version: 2

project_name: devopsgen

before:
  hooks:
    - go mod tidy

builds:
  - id: devopsgen
    binary: devopsgen
    main: ./cmd/devopsgen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X devopsgen.dev/devopsgen/internal/cli.version={{.Version}}
      - -X devopsgen.dev/devopsgen/internal/cli.commit={{.Commit}}
      - -X devopsgen.dev/devopsgen/internal/cli.date={{.Date}}
      - -X devopsgen.dev/devopsgen/internal/templates.Version={{.Version}}

archives:
  - id: default
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - "^refactor:"
      - "^style:"